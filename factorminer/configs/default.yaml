# =============================================================================
# FactorMiner Default Configuration
# =============================================================================
# This file provides sensible defaults for the FactorMiner mining pipeline.
# Override any setting by providing a user config file via --config flag,
# or by passing CLI options directly.
#
# Resolution order: defaults -> user config -> CLI overrides
# =============================================================================

# ---------------------------------------------------------------------------
# Data paths
# ---------------------------------------------------------------------------
# Path to market data CSV/Parquet/HDF5 file. Set to null to use mock data.
data_path: null

# Directory for all output artifacts (libraries, plots, logs).
output_dir: "./output"

# ---------------------------------------------------------------------------
# Mining parameters (Ralph Loop)
# ---------------------------------------------------------------------------
mining:
  # Target number of factors in the final library (paper: 110)
  target_library_size: 110

  # Number of candidate factors to generate per iteration (paper: 40)
  batch_size: 40

  # Maximum number of Ralph Loop iterations before stopping
  max_iterations: 0  # Run until the target, planner stop, or interruption; no automatic quota.

  # Minimum absolute IC for a factor to pass Stage 1 screening (paper: 0.04)
  ic_threshold: 0.04

  # Optional minimum ICIR gate. The paper's admission rule (eq. 10) has none,
  # so 0 disables it; raise it to trade library size for stability.
  icir_threshold: 0.0

  # Maximum pairwise |rho| allowed between library factors (paper: 0.5)
  correlation_threshold: 0.5

  # Minimum IC required for a candidate to replace an existing factor
  replacement_ic_min: 0.10

  # Replacement IC ratio: candidate IC must be >= ratio * existing IC
  replacement_ic_ratio: 1.3

  # Mine only on data.train_period (target-purged). The test period is never
  # seen by admission, replacement, or memory (paper: 2024 train, 2025 test).
  train_split_only: true

# ---------------------------------------------------------------------------
# Evaluation backend
# ---------------------------------------------------------------------------
evaluation:
  # Number of parallel workers for factor evaluation
  num_workers: 40

  # Number of assets used in fast IC screening (Stage 1)
  fast_screen_assets: 100

  # WorldQuant BRAIN-style checks on a market-neutral book, applied after the
  # IC/ICIR gates and before the library correlation gate. Off by default.
  # Keys (BRAIN defaults): sharpe_min 1.25, fitness_min 1.0, turnover_min 0.01,
  # turnover_max 0.70, max_weight 0.10, sub_universe_fraction 0.333,
  # sub_universe_sharpe_ratio 0.75, liquidity_window 20, periods_per_year 252.
  portfolio_checks:
    enabled: false

  # GPU device identifier (used when backend is "gpu")
  gpu_device: "cuda:0"

  # Computation backend: "numpy" (portable CPU), "gpu" (CUDA),
  # or "c" (compiled CPU kernels via Bottleneck)
  backend: "numpy"

  # Redundancy/dependence metric used for admission, replacement,
  # and library geometry diagnostics.
  redundancy_metric: "spearman"

  # How to handle factor expression failures during evaluation/mining:
  # "reject" = fail the factor/command, "synthetic" = deterministic fallback,
  # "raise" = propagate the raw exception.
  signal_failure_policy: "reject"

  # Storage precision for retained benchmark signal panels. Metrics are
  # computed at float64 precision before storage; float32 uses half the RAM.
  signal_dtype: "float64"

  # Resident budget (MiB) for retained benchmark signal panels. When set,
  # least-recently-used panels spill to temporary .npy files and are read back
  # exactly through memory maps. null keeps every retained panel in memory.
  signal_cache_mb: null

# ---------------------------------------------------------------------------
# Data loading
# ---------------------------------------------------------------------------
data:
  # Market type: "a_shares", "crypto", etc.
  market: "a_shares"

  # Asset universe filter: "CSI500", "CSI1000", "HS300", "Binance"
  universe: "CSI500"

  # Bar frequency: "10min", "30min", "1h", "1d"
  frequency: "10min"

  # Feature columns available for factor construction
  features:
    - "$open"
    - "$high"
    - "$low"
    - "$close"
    - "$volume"
    - "$amt"
    - "$vwap"
    - "$returns"

  # Training period [start, end] in ISO format
  train_period: ["2024-01-01", "2024-12-31"]

  # Out-of-sample test period [start, end] in ISO format
  test_period: ["2025-01-01", "2025-12-31"]

  # Raw-field preprocessing before formulas are evaluated. The paper applies
  # its DSL to raw price/volume fields and standardizes only realized factor
  # signals, so both are off: Div($close, $vwap) keeps its price meaning.
  # Missing-value filling and halt masking always run.
  standardise_raw_features: false
  winsorise_raw_features: false

  # Named target definitions. The default target drives benchmark-facing metrics;
  # research mode can score all configured targets jointly.
  targets:
    - name: "paper"
      entry_delay_bars: 1
      holding_bars: 1
      price_pair: "open_to_close"
      return_transform: "simple"

  # Target used for paper-style scalar evaluation surfaces.
  default_target: "paper"

# ---------------------------------------------------------------------------
# LLM provider settings
# ---------------------------------------------------------------------------
llm:
  # Provider name: "openai", "anthropic", "google", "openai_compatible",
  # "local", or "mock"
  provider: "google"

  # Model identifier (provider-specific)
  # OpenAI:    "gpt-4o", "gpt-4", etc.
  # Anthropic: "claude-sonnet-4-6", "claude-opus-4-6", etc.
  # Google:    "gemini-2.0-flash", etc.
  # Local:     Ollama/vLLM/SGLang model name
  model: "gemini-2.0-flash"

  # API key for the chosen provider.
  # Can also be set via environment variables:
  #   OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLE_API_KEY
  # NEVER set a frontier API key when provider is openai_compatible/local —
  # local engines use cascade.draft_api_key / local_api_key instead.
  api_key: null

  # Sampling temperature for factor generation (higher = more creative)
  temperature: 0.8

  # Maximum tokens in LLM response
  max_tokens: 4096

  # Number of candidate factors requested per LLM call
  batch_candidates: 40

  # Prompt caching (default ON). Anthropic: cache_control ephemeral breakpoint
  # on the stable system prefix. OpenAI: prompt_cache_key from that prefix.
  # Harmless no-op under --mock / Google.
  prompt_cache: true

  # Request timeout seconds for frontier HTTP clients.
  timeout_s: 120.0
  # Opt-in SSE for OpenAI-compatible endpoints; reasoning keeps proxy connections active.
  stream: false
  # Retry interrupted SSE bodies at most this many times (partial text is discarded).
  stream_retries: 0

  # Optional OpenAI-compatible base_url (local YAML only — SSRF-sensitive;
  # never accept from remote/untrusted input). Prefer cascade.draft_base_url
  # for local draft engines so frontier keys are not forwarded.
  base_url: null

  # Cheap-first cascade: local draft -> deterministic DSL parse signal ->
  # frontier escalate only on parse failure. Default OFF.
  # Viable because FactorMiner has a deterministic expression parser — a free
  # routing signal most generic agentic-cost papers do not have.
  cascade_enabled: false
  cascade_draft_provider: "openai_compatible"
  cascade_draft_model: "llama3.2"
  # SECURITY (SSRF): draft_base_url from local config only.
  cascade_draft_base_url: "http://127.0.0.1:11434/v1"
  cascade_timeout_s: 60.0
  cascade_escalate_on_parse_failure: true

  # Nested cascade block (optional alternative to the flat cascade_* keys).
  # cascade:
  #   enabled: false
  #   draft_provider: openai_compatible
  #   draft_model: llama3.2
  #   draft_base_url: "http://127.0.0.1:11434/v1"
  #   draft_api_key: local
  #   timeout_s: 60.0
  #   escalate_on_parse_failure: true

# ---------------------------------------------------------------------------
# Experience memory system
# ---------------------------------------------------------------------------
memory:
  # Retrieval/distillation policy: "paper", "none", "kg",
  # "family_aware", or "regime_aware"
  policy: "paper"

  # Maximum number of success patterns to retain in memory
  max_success_patterns: 50

  # Maximum number of failure patterns to retain in memory
  max_failure_patterns: 100

  # Maximum number of distilled insights in memory
  max_insights: 30

  # How often (in iterations) to consolidate memory
  consolidation_interval: 10

  # Rolling window used when policy == "regime_aware"
  regime_lookback_window: 60

  # Initial memory when no checkpoint is resumed. "empty" starts from M = {}
  # so every pattern is learned from this run's trajectories. "paper_defaults"
  # preloads the patterns the paper reports after mining (Tables 6/10); use it
  # to deploy that experience, not to reproduce its discovery process.
  seed: "empty"

  # After each batch, ask the LLM to interpret the evaluator's feedback and
  # propose hypotheses for the next batch (one extra call per iteration).
  # Not part of the paper protocol; numbers in the prompt remain evaluator-computed.
  llm_reflection: false
  reflection_max_tokens: 1024
  # Provider overrides for the reflection call only (empty = reuse llm).
  # Keys without `provider` are merged onto `llm`; another provider stands alone.
  reflection_llm: {}

  # Optional experiment-history retrieval, exact AST checks, advisory LLM
  # review and bounded replacements. An extension, NOT the paper baseline.
  evidence_guided:
    enabled: false
    reserve_candidates: 2
    max_replacement_rounds: 2
    history_limit: 6
    match_limit: 3
    max_context_chars: 8000
    similarity_threshold: 0.65
    review_enabled: true
    max_review_calls: 2
    max_review_candidates: 8
    review_max_tokens: 2048
    enable_embeddings: false

# ---------------------------------------------------------------------------
# Benchmarking and reporting
# ---------------------------------------------------------------------------
benchmark:
  # Execution lane: "paper" for strict reproduction, "research" for Helix extensions
  mode: "paper"

  # Global RNG seed for deterministic benchmark selection and synthesis
  seed: 42

  # Number of frozen factors selected on the freeze universe/train split
  freeze_top_k: 40

  # Universe used for Top-K freeze selection
  freeze_universe: "CSI500"

  # Universes included in benchmark reporting
  report_universes:
    - "CSI500"
    - "CSI1000"
    - "HS300"
    - "Binance"

  # Baselines enabled in the benchmark suite
  baselines:
    - "alpha101_classic"
    - "alpha101_adapted"
    - "random_exploration"
    - "gplearn"
    - "alphaforge_style"
    - "alphaagent_style"
    - "factor_miner"
    - "factor_miner_no_memory"

  # Transaction-cost pressure settings in basis points
  cost_bps: [1.0, 4.0, 7.0, 10.0, 11.0]

  # Reference panel shape [periods, assets] used for efficiency benchmarks
  efficiency_panel_shape: [12610, 500]

  # Optional mock benchmark panel shape [periods, assets]. Leave null for the
  # benchmark's paper-scale mock defaults; CI can set a tiny smoke panel here.
  mock_panel_shape: null

  # Optional runtime ablation grid over memory policy × dependence metric × backend.
  # This is only used by the canonical runtime benchmark surface.
  strategy_ablation:
    enabled: false
    baseline: "factor_miner"
    memory_policies: ["paper", "none", "kg", "family_aware", "regime_aware"]
    dependence_metrics: ["spearman", "pearson", "distance_correlation"]
    backends: ["numpy", "c", "gpu"]

# ---------------------------------------------------------------------------
# Research-first multi-horizon scoring
# ---------------------------------------------------------------------------
research:
  enabled: false
  # Maximum persisted research hypotheses injected into any generation batch.
  knowledge_retrieval_limit: 4

  # single_horizon | weighted_multi_horizon | pareto_multi_horizon | net_ir
  primary_objective: "weighted_multi_horizon"

  # weighted | pareto
  target_aggregation: "weighted"

  # Optional explicit weights per target name. Empty => infer from data.targets order.
  horizon_weights: {}

  uncertainty:
    bootstrap_samples: 200
    block_size: 20
    shrinkage_strength: 1.0
    lcb_zscore: 1.0
    fdr_alpha: 0.05

  admission:
    use_residual_ic: true
    use_effective_rank_gain: true
    strict_profile: false
    cross_fit_residual: true
    turnover_penalty: 0.05
    redundancy_penalty: 0.20
    min_score: 0.04
    min_lcb: 0.0
    min_residual_ic: 0.02
    min_span_gain: 0.05
    min_effective_rank_gain: 0.0
    min_log_det_gain: -0.10
    ridge_lambda: 0.001
    log_det_epsilon: 0.000001

  selection:
    models: ["ridge", "elastic_net", "lasso", "xgboost"]
    rolling_train_window: 80
    rolling_test_window: 20
    rolling_step: 20

  regimes:
    enabled: false
    definition: "return_volatility_liquidity"

  execution:
    cost_model: "linear_bps"
    cost_bps: 4.0

# ---------------------------------------------------------------------------
# Phase 2 advanced features (disabled by default)
# ---------------------------------------------------------------------------
phase2:
  # Causal validation: Granger causality + intervention tests
  causal:
    enabled: false
    granger_max_lag: 5
    granger_significance: 0.05
    n_interventions: 3
    intervention_magnitude: 2.0
    intervention_ic_threshold: 0.5
    robustness_threshold: 0.4
    granger_weight: 0.4
    intervention_weight: 0.6

  # Regime-conditional evaluation (bull/bear/high-vol/low-vol)
  regime:
    enabled: false
    lookback_window: 60
    bull_return_threshold: 0.0
    bear_return_threshold: 0.0
    volatility_percentile: 0.7
    min_regime_ic: 0.03
    min_regimes_passing: 2

  # Strategy capacity estimation
  capacity:
    enabled: false
    base_capital_usd: 100000000.0
    ic_degradation_limit: 0.20
    net_icir_threshold: 0.3
    sigma_annual: 0.25

  # Statistical significance testing (bootstrap + FDR)
  significance:
    enabled: false
    bootstrap_n_samples: 1000
    bootstrap_block_size: 20
    bootstrap_method: circular_block
    fdr_level: 0.05
    deflated_sharpe_enabled: true
    min_deflated_sharpe: 0.0

  # Multi-specialist debate-based generation
  debate:
    enabled: false
    num_specialists: 3
    candidates_per_specialist: 15
    enable_critic: true
    top_k_after_critic: 40
    critic_temperature: 0.3

  # Automatic operator invention
  auto_inventor:
    enabled: false
    invention_interval: 10
    max_proposals_per_round: 5
    min_ic_contribution: 0.03
    store_dir: "./output/custom_operators"

  # Helix knowledge and memory system
  helix:
    enabled: false
    enable_knowledge_graph: false
    enable_embeddings: false
    enable_canonicalization: true
    forgetting_lambda: 0.95
    forgetting_demotion_threshold: 20

# ---------------------------------------------------------------------------
# Observability: per-iteration traces of prompts, LLM outputs, evaluations
# and memory updates (factorminer.utils.tracing)
# ---------------------------------------------------------------------------
observability:
  # "auto" sends traces to Langfuse when LANGFUSE_PUBLIC_KEY and
  # LANGFUSE_SECRET_KEY (and optionally LANGFUSE_BASE_URL) are set and the
  # langfuse package is installed (pip install 'factorminer[observability]').
  # "on" warns when they are missing; "off" disables Langfuse.
  langfuse: "auto"
  # Fetch production prompt versions and link them to LLM generations.
  # Publish explicitly with scripts/sync_langfuse_prompts.py; offline uses local prompts.
  prompt_management: true
  # Always-on offline copy: <output_dir>/trace_log.jsonl (+ system_prompts/).
  local_log: true
  # Keeps test runs out of production dashboards in Langfuse.
  environment: "development"
  release: ""
  sample_rate: 1.0
